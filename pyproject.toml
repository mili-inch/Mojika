[project]
name = "mojika"
version = "0.1.0"
description = "Conditional kanji generation: training and interactive demo"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = "==3.13.*"
dependencies = [
  "torch==2.9.1+cu130",
  "torchvision==0.24.1+cu130",
  "numpy>=2.4.1",
  "pillow>=12.1.0",
  "safetensors>=0.8.0",
  "fonttools>=4.60.1",
  "huggingface-hub>=0.30,<1",
  "transformers==4.51.3",
  "sentencepiece>=0.2",
  "protobuf>=5",
  "timm>=1.0,<2",
  "einops>=0.8",
  "anyio>=4,<5",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "websockets>=15,<16",
]

[dependency-groups]
dev = ["ruff>=0.14.10", "httpx>=0.28,<1"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
